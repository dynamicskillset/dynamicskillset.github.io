name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: 80.78.23.57
          VPS_USER: root
          DEPLOY_PATH: /opt/ghost/sites/dynamicskillset.com
        run: |
          # Write SSH key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Backup existing index.html with date stamp
          DATESTAMP=$(date +%Y%m%d_%H%M%S)
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "if [ -f $DEPLOY_PATH/index.html ]; then cp $DEPLOY_PATH/index.html $DEPLOY_PATH/index.html.backup.$DATESTAMP; fi"

          # Sync site files (exclude git/github internals, node_modules, backups)
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.backup.*' \
            --exclude='New website' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
