name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: root
          DEPLOY_PATH: /opt/ghost/sites/dynamicskillset.com
        run: |
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          # Backup existing index.html with date stamp
          DATESTAMP=$(date +%Y%m%d_%H%M%S)
          ssh "$VPS_USER@$VPS_HOST" \
            "if [ -f $DEPLOY_PATH/index.html ]; then cp $DEPLOY_PATH/index.html $DEPLOY_PATH/index.html.backup.$DATESTAMP; fi"

          # Sync site files (exclude git/github internals, node_modules, backups, subdirectory deployments)
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.backup.*' \
            --exclude='New website' \
            --exclude='contours' \
            --exclude='sightlines' \
            --exclude='badge-studio' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
